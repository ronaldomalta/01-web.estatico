#cloud-config
# Missão 1 - Servidor Web Estático
package_update: true

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html lang="pt-BR">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Laboratório Cloud-init - Missão 1</title>
        <style>
          body { margin: 0; min-height: 100vh; display: grid; place-items: center;
                 font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
          main { max-width: 630px; padding: 40px; text-align: center;
                 border: 1px solid #334155; border-radius: 18px; background: #1e293b; }
          h1 { color: #38bdf8; }
          p { line-height: 1.6; }
        </style>
      </head>
      <body>
        <main>
          <h1>Bem-vindo ao servidor Cloud-init!</h1>
          <p>Missão 1 concluída: o Nginx e esta página foram configurados automaticamente pelo Cloud-init.</p>
          <p>Laboratório FAP DevOps | Multipass + Ubuntu + Nginx</p>
        </main>
      </body>
      </html>

runcmd:
  - systemctl enable --now nginx
  - systemctl restart nginx
